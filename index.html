    <style>
      /* Splash: painted before any script runs, removed by src/lib/splash.ts. */
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 14px;
        padding: 24px; text-align: center; color: #fff;
        font-family: 'Clarity City Variable', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, #1c6e8c 0%, #0f3b5f 55%, #08131d 100%);
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #splash.is-hidden { opacity: 0; visibility: hidden; }
      #splash svg { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35); animation: splash-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #splash .splash-name { margin: 6px 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; animation: splash-up 0.5s 0.15s ease both; }
      #splash .splash-name span { color: #6ee7b7; }
      #splash .splash-tag { margin: 0; max-width: 18rem; font-size: 0.95rem; opacity: 0.8; animation: splash-up 0.5s 0.25s ease both; }
      #splash .splash-bar { width: 120px; height: 3px; margin-top: 18px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
      #splash .splash-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #6ee7b7; animation: splash-load 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { transform: scale(0.7); opacity: 0; } }
      @keyframes splash-up { from { transform: translateY(8px); opacity: 0; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
    </style>
  </head>
